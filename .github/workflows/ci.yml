# Integración continua: ejecuta todas las pruebas en cada push y en cada pull request.
# Las pruebas abren un navegador de verdad contra un Google simulado: no hay claves ni datos reales.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-24.04   # fijo: Playwright 1.56 no soporta aún la imagen de ubuntu-latest (Ubuntu 26)
    timeout-minutes: 45
    env:
      NAVEGADOR: chromium   # el Chromium que instala Playwright (en local se usa Edge)
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Navegador de Playwright (con caché)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Pruebas
        run: npm test 2>&1 | tee salida-pruebas.txt
      - name: Resumen de las pruebas que fallan
        if: failure()
        run: |
          {
            echo '## Pruebas'
            echo '```'
            grep -E '^(✔|✖)|FALLA|Resumen|Pruebas:' salida-pruebas.txt || true
            echo '```'
            echo '## Salida de lo que falla (final)'
            echo '```'
            tail -c 50000 salida-pruebas.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
